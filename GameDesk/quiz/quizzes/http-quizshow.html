<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HTTP Quizshow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#12141c;--surface:#1d2130;--line:#2c3246;--text:#f1efe8;--muted:#9aa0b5;
  --red:#d9534a;--blue:#3a78d0;--amber:#d99a22;--green:#2c9c66;--ok:#3fcf86;--bad:#ff6b5e;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--display);font-size:16px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:13px;color:var(--muted);flex-wrap:wrap}
.bar b{color:var(--text)}
.status{font-family:var(--mono);font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:4px}
h1{font-size:clamp(34px,7vw,64px);font-weight:800;line-height:1;margin:0;text-wrap:balance;letter-spacing:-.02em}
.req{font-family:var(--mono);font-size:clamp(14px,2.4vw,18px);color:var(--muted);margin:0}
.req span{color:var(--amber)}
.lead{color:var(--muted);max-width:60ch;line-height:1.5;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0;color:var(--text)}
button:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.btn{background:var(--text);color:var(--ground);font-weight:800;font-size:18px;padding:14px 26px;border-radius:6px}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.ghost[aria-pressed="true"]{border-color:var(--text)}
.question{background:var(--surface);border-radius:8px;padding:28px 22px;text-align:center;font-size:clamp(22px,4vw,34px);font-weight:800;line-height:1.2;text-wrap:balance}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--text);width:100%;transform-origin:left}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.ans{display:flex;align-items:center;gap:14px;text-align:left;padding:18px 16px;border-radius:6px;font-size:clamp(16px,2.6vw,20px);font-weight:500;min-height:76px;transition:transform .1s,opacity .2s}
.ans:hover:not(:disabled){transform:translateY(-2px)}
.ans svg{flex:none;width:30px;height:30px;fill:#fff}
.ans:nth-child(1){background:var(--red)}.ans:nth-child(2){background:var(--blue)}.ans:nth-child(3){background:var(--amber)}.ans:nth-child(4){background:var(--green)}
.ans.dim{opacity:.25}.ans.right{outline:4px solid var(--ok);outline-offset:3px;opacity:1}
.ans:disabled{cursor:default}
.fb{border-left:4px solid var(--ok);background:var(--surface);padding:14px 16px;border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:6px}
.fb.no{border-color:var(--bad)}
.fb .code{font-family:var(--mono);font-weight:700}
.fb.yes .code{color:var(--ok)}.fb.no .code{color:var(--bad)}
.fb p{margin:0;line-height:1.45;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big{font-size:clamp(56px,12vw,110px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:10px}
.review div{background:var(--surface);padding:12px 14px;border-radius:6px;line-height:1.4}
.review small{display:block;color:var(--ok);font-family:var(--mono);font-size:13px;margin-top:4px}
.streak{color:var(--amber)}
@media (prefers-reduced-motion:reduce){.ans,.timer i{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const ALL = [{"q": "Wofür steht HTTP?", "a": ["Hypertext Transmission Process", "Hyper Text Transport Program", "Hypertext Transfer Protocol", "High Transfer Text Protocol"], "c": 2, "e": "HTTP = Hypertext Transfer Protocol – damit werden Webseiteninformationen übertragen."}, {"q": "Wofür wird HTTP hauptsächlich verwendet?", "a": ["IP-Adressen verteilen", "E-Mails verschlüsseln", "Netzwerkkabel testen", "Webseiten-Infos im Internet übertragen"], "c": 3, "e": "Jedes Mal, wenn du eine Webseite im Browser öffnest, wird HTTP(s) verwendet."}, {"q": "Wer startet bei HTTP die Kommunikation?", "a": ["Der Server", "Der Client", "Beide gleichzeitig", "Der Router"], "c": 1, "e": "Der Client schickt eine Anfrage (Request) an den Server."}, {"q": "Was macht der Server?", "a": ["Zeigt die Webseite im Browser an", "Speichert alle alten Anfragen", "Wartet auf Anfragen und beantwortet sie", "Startet jede Kommunikation"], "c": 2, "e": "Der Server wartet auf eingehende Anfragen und schickt eine Antwort (Response)."}, {"q": "Welche Software ist ein Client, der automatisiert Infos holt?", "a": ["cloudflare", "curl", "Wireshark", "HTML"], "c": 1, "e": "Der Client kann ein Mensch im Browser sein oder ein Programm wie curl."}, {"q": "Warum muss man wissen, wo der Server ist (z.B. IP)?", "a": ["Damit er zustandslos bleibt", "Damit der Body leer ist", "Damit der Client ihn ansprechen kann", "Damit er Anfragen starten kann"], "c": 2, "e": "Der Server ist statisch – der Client braucht seine Adresse."}, {"q": "Warum braucht man wenig Infos über den Client?", "a": ["Weil er immer dieselbe IP hat", "Weil er nur HEAD benutzt", "Weil er keinen Header sendet", "Weil er die Kommunikation startet"], "c": 3, "e": "Der Client ist dynamisch – er kann überall sein, da er selbst anfragt."}, {"q": "Welche zwei Nachrichtentypen gibt es bei HTTP?", "a": ["GET und SET", "Request und Response", "Upload und Download", "Header und Footer"], "c": 1, "e": "Anfragen (Requests) und Antworten (Responses)."}, {"q": "Was bedeutet 'zustandslos'?", "a": ["Server ist immer offline", "Client hat keine IP-Adresse", "Server merkt sich keine früheren Anfragen", "Nachrichten haben keinen Header"], "c": 2, "e": "HTTP ist zustandslos: jede Anfrage steht für sich allein."}, {"q": "Was folgt daraus, dass HTTP zustandslos ist?", "a": ["Der Server speichert alles", "Antworten haben keinen Body", "Es gibt nur eine Anfrage pro Tag", "Jeder Request muss alle nötigen Daten enthalten"], "c": 3, "e": "Der Server weiss nicht, dass sich Anfrage 2 auf Anfrage 1 bezieht."}, {"q": "Aus welchen zwei Teilen kann eine HTTP-Nachricht bestehen?", "a": ["Client und Server", "Header und Body", "Kopf und Fuss", "Path und Port"], "c": 1, "e": "Header = Zusatzinfos, Body = eigentliche Nachricht."}, {"q": "Was steht im Header?", "a": ["Gar nichts, er ist immer leer", "Immer die ganze Webseite", "Nur Bilddaten", "Zusatzinformationen (Metadaten)"], "c": 3, "e": "Der Header enthält Zusatzinfos zur Nachricht, der Body den Inhalt."}, {"q": "Was steht im Request-Header z.B. zusätzlich drin?", "a": ["Der Statuscode 200", "Das hochgeladene Bild", "Gewünschte Sprache der Antwort", "Die HTML-Seite"], "c": 2, "e": "Z.B. wer anfragt oder in welcher Sprache die Antwort gewünscht ist (Accept-Language)."}, {"q": "Wo steckt beim Datei-Upload die Datei?", "a": ["Im Request Header", "In der URL", "Im Request Body", "Im Response Header"], "c": 2, "e": "Der Request Body wird verwendet, um Daten an den Server zu senden."}, {"q": "Was steht im Response Body, wenn du eine Webseite anfragst?", "a": ["Deine IP-Adresse", "Nichts, er ist immer leer", "Die Anfragemethode", "Die HTML-Daten"], "c": 3, "e": "Bei einer Webseite: HTML. Bei einem Bild: binäre Bilddaten."}, {"q": "Wann kann der Response Body leer sein?", "a": ["Nach einem Upload ('hat geklappt')", "Nie", "Bei jeder Webseite", "Nur bei Bildern"], "c": 0, "e": "Der Server schickt dann nur die Metainfo 'es hat geklappt'."}, {"q": "Welche Info kann im Response Header stehen?", "a": ["Länge und Format der Nachricht", "Die MAC-Adresse des Servers", "Das Passwort des Users", "Der ganze HTML-Code"], "c": 0, "e": "Z.B. wie lang die Nachricht ist oder ob sie HTML/XML/JSON ist."}, {"q": "Welcher Begriff ist ein anderer Name für Anfragemethoden?", "a": ["HTTP-Header", "HTTP-Verben", "HTTP-Codes", "HTTP-Ports"], "c": 1, "e": "Anfragemethoden = HTTP-Verben = HTTP-Methoden = Request-Methoden."}, {"q": "Welche ist die gebräuchlichste Anfragemethode?", "a": ["DELETE", "GET", "PUT", "POST"], "c": 1, "e": "GET holt Informationen vom Server, z.B. Webseiten."}, {"q": "Wie sieht der Body eines GET-Requests aus?", "a": ["Enthält den Statuscode", "Enthält die ganze Webseite", "Enthält immer eine Datei", "Leer – Info steht im Path"], "c": 3, "e": "Was abgefragt wird, steht im Path der Anfrage."}, {"q": "Du registrierst dich in einem Onlineshop. Welche Methode?", "a": ["POST", "HEAD", "GET", "DELETE"], "c": 0, "e": "POST überträgt Daten vom Client zum Server (Formulare, Uploads)."}, {"q": "Welche Methode fragt nur den Header ohne Body an?", "a": ["GET", "HEAD", "POST", "PATCH"], "c": 1, "e": "HEAD = nur der Header, ohne Body."}, {"q": "Wofür ist HEAD besonders nützlich?", "a": ["Formulare absenden", "Dateien hochladen", "Daten löschen", "Prüfen, ob es neuere Daten gibt"], "c": 3, "e": "So spart man Ressourcen, statt unnötig alles mit GET zu laden."}, {"q": "Datensatz aktualisieren oder erstellen, falls er fehlt?", "a": ["HEAD", "PUT", "GET", "PATCH"], "c": 1, "e": "PUT schickt die ganze Information mit und erstellt sie notfalls neu."}, {"q": "Nur das Profilbild eines Users ändern – welche Methode reicht?", "a": ["POST", "PATCH", "PUT", "DELETE"], "c": 1, "e": "PATCH = Partial Update, ein Teil der Daten genügt."}, {"q": "Was ist der Unterschied zwischen PUT und PATCH?", "a": ["Es gibt keinen Unterschied", "PATCH schickt alles, PUT nur einen Teil", "PUT löscht, PATCH erstellt", "PUT schickt alles, PATCH nur einen Teil"], "c": 3, "e": "Beide aktualisieren – PUT mit allen Daten, PATCH nur mit dem geänderten Teil."}, {"q": "Welche Methode löscht eine Ressource auf dem Server?", "a": ["DELETE", "REMOVE", "HEAD", "PATCH"], "c": 0, "e": "DELETE löscht z.B. einen Datensatz in der Datenbank."}, {"q": "Welchen Filter setzt du in Wireshark für HTTP?", "a": ["http", "tcp.port", "web", "html"], "c": 0, "e": "Filter auf http setzen, dann example.com aufrufen."}, {"q": "Wie viele HTTP-Einträge siehst du in Wireshark beim Öffnen von example.com?", "a": ["4 – zwei Requests, zwei Responses", "1 – nur die Antwort", "0 – HTTP ist unsichtbar", "2 – Request und Response"], "c": 3, "e": "Erster Eintrag = Anfrage, zweiter = Antwort."}, {"q": "'GET / HTTP/1.1' – was steht da NICHT drin?", "a": ["Die Anfragemethode", "Der Statuscode", "Der angeforderte Pfad", "Die HTTP-Version"], "c": 1, "e": "Die erste Request-Zeile: Methode, URI und HTTP-Version."}, {"q": "Was bedeutet das '/' in 'GET / HTTP/1.1'?", "a": ["Der Body ist leer", "Die Anfrage ist fehlgeschlagen", "Es wird alles gelöscht", "Kein bestimmter Pfad angefordert"], "c": 3, "e": "Ohne bestimmten Pfad wird '/' verwendet."}, {"q": "Was bedeutet 'HTTP/1.1 200 OK'?", "a": ["Anfrage erfolgreich bearbeitet", "200 Anfragen gesendet", "Server nicht gefunden", "Die Seite ist 200 KB gross"], "c": 0, "e": "200 OK = der Server konnte die Anfrage erfolgreich bearbeiten."}, {"q": "Wer stellt die Request-Header (Host, User-Agent …) zusammen?", "a": ["Wireshark", "Der Server", "Der Browser automatisch", "Du von Hand"], "c": 2, "e": "Die Headerinfos hat dein Browser automatisch für dich zusammengestellt."}, {"q": "Welcher Response-Header sagt, welches Format der Inhalt hat?", "a": ["Host", "Age", "Content-Type", "User-Agent"], "c": 2, "e": "Content-Type: text/html heisst: der Inhalt ist HTML."}, {"q": "Welcher Header verrät die Server-Software (z.B. cloudflare)?", "a": ["Host", "Accept", "Server", "Connection"], "c": 2, "e": "Im Beispiel: Server: cloudflare."}, {"q": "Welche Formate kann ein Response Body z.B. enthalten?", "a": ["Nur HTML", "Nur Bilder", "HTML, JSON oder XML", "Nur Text"], "c": 2, "e": "Im Beispiel HTML – es könnten aber auch JSON, XML oder ganz anderes sein."}];
const SHAPES=['<svg viewBox="0 0 30 30"><path d="M15 3 28 27H2z"/></svg>','<svg viewBox="0 0 30 30"><path d="M15 2 28 15 15 28 2 15z"/></svg>','<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13"/></svg>','<svg viewBox="0 0 30 30"><rect x="3" y="3" width="24" height="24"/></svg>'];
const app=document.getElementById('app');
let S={n:15,time:30,qs:[],i:0,score:0,right:0,streak:0,wrong:[],t0:0,timer:null};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function home(){
  clearInterval(S.timer);
  app.innerHTML=`
  <div class="bar"><span>Telematik · Moodle-Buch «HTTP»</span><span class="status">${ALL.length} Fragen</span></div>
  <p class="req"><span>GET</span> /quiz HTTP/1.1</p>
  <h1>HTTP Quizshow</h1>
  <p class="lead">Client &amp; Server, zustandslos, Header &amp; Body, Anfragemethoden und Wireshark-Praxis. Je schneller du antwortest, desto mehr Punkte – wie bei Kahoot.</p>
  <div><p class="lead" style="margin-bottom:8px">Anzahl Fragen</p><div class="row" id="cnt">
    ${[10,15,ALL.length].map(n=>`<button class="btn ghost" aria-pressed="${n===S.n}" data-n="${n}">${n===ALL.length?'Alle '+n:n}</button>`).join('')}
  </div></div>
  <div><p class="lead" style="margin-bottom:8px">Zeit pro Frage</p><div class="row" id="tm">
    ${[20,30,60,90].map(n=>`<button class="btn ghost" aria-pressed="${n===S.time}" data-t="${n}">${n} s</button>`).join('')}
  </div></div>
  <div><button class="btn" id="go">Los geht's</button></div>`;
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;home()});
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.time=+b.dataset.t;home()});
  document.getElementById('go').onclick=start;
}
function start(){
  S.qs=shuffle(ALL).slice(0,S.n).map(q=>{const idx=shuffle([0,1,2,3]);return{q:q.q,e:q.e,a:idx.map(k=>q.a[k]),c:idx.indexOf(q.c)}});
  Object.assign(S,{i:0,score:0,right:0,streak:0,wrong:[]});show();
}
function show(){
  const q=S.qs[S.i];
  app.innerHTML=`
  <div class="bar"><span>Frage <b>${S.i+1}</b> / ${S.qs.length}</span><span>Punkte <b>${S.score}</b>${S.streak>1?` · <span class="streak">Serie ${S.streak}</span>`:''}</span></div>
  <div class="timer"><i id="ti"></i></div>
  <div class="question">${esc(q.q)}</div>
  <div class="grid">${q.a.map((a,k)=>`<button class="ans" data-k="${k}">${SHAPES[k]}<span>${esc(a)}</span></button>`).join('')}</div>
  <div id="fb"></div>`;
  app.querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  S.t0=performance.now();const ti=document.getElementById('ti');
  S.timer=setInterval(()=>{const left=1-(performance.now()-S.t0)/(S.time*1000);ti.style.transform=`scaleX(${Math.max(0,left)})`;if(left<=0)answer(-1)},50);
}
function answer(k){
  clearInterval(S.timer);
  const q=S.qs[S.i],ok=k===q.c,used=(performance.now()-S.t0)/(S.time*1000);
  let pts=0;
  if(ok){S.streak++;S.right++;pts=Math.round(1000*(1-Math.min(used,1)/2))+(S.streak>1?100*Math.min(S.streak-1,5):0);S.score+=pts}
  else{S.streak=0;S.wrong.push(q)}
  app.querySelectorAll('.ans').forEach((b,j)=>{b.disabled=true;b.classList.add(j===q.c?'right':'dim')});
  const last=S.i===S.qs.length-1;
  document.getElementById('fb').innerHTML=`
  <div class="foot" style="flex-direction:column;align-items:stretch">
    <div class="fb ${ok?'yes':'no'}"><span class="code">${ok?`HTTP/1.1 200 OK · +${pts}`:(k<0?'408 Request Timeout':'400 Bad Request')}</span><p>${esc(q.e)}</p></div>
    <div><button class="btn" id="nx">${last?'Resultat':'Nächste Frage'}</button></div>
  </div>`;
  const nx=document.getElementById('nx');nx.focus();
  nx.onclick=()=>{if(last)end();else{S.i++;show()}};
}
function end(){
  const pct=Math.round(S.right/S.qs.length*100);
  app.innerHTML=`
  <div class="bar"><span>Response</span><span class="status">${pct>=50?'200 OK':'500 Nochmals lernen'}</span></div>
  <div><div class="big">${S.score}</div><p class="lead">Punkte · ${S.right} von ${S.qs.length} richtig (${pct}%)</p></div>
  <div class="row"><button class="btn" id="again">Nochmal spielen</button><button class="btn ghost" id="menu">Einstellungen</button></div>
  ${S.wrong.length?`<h2 style="margin:8px 0 0;font-size:22px">Das solltest du nochmals anschauen</h2>
  <div class="review">${S.wrong.map(q=>`<div>${esc(q.q)}<small>→ ${esc(q.a[q.c])}</small></div>`).join('')}</div>`:'<p class="lead">Alles richtig. Stark!</p>'}`;
  document.getElementById('again').onclick=start;document.getElementById('menu').onclick=home;
}
document.addEventListener('keydown',e=>{const k='1234'.indexOf(e.key);const b=app.querySelectorAll('.ans:not(:disabled)')[k];if(b)b.click()});
home();
</script>

</body></html>
