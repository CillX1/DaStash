  <rect x="166" y="96" width="8" height="32" rx="4" fill="#45d483"/>
  <rect x="178" y="72" width="8" height="56" rx="4" fill="#45d483"/>
  <rect x="190" y="86" width="8" height="42" rx="4" fill="#45d483"/>

  <!-- small tile: status dot -->
