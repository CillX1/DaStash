name: Build installers

# Every push to main builds all installers (downloadable from the run's page);
# pushing a tag like v1.6.0 also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = ((Select-String -Path GameDesk/Install.ps1 -Pattern "\`$version = '(.+)'").Matches[0].Groups[1].Value) }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\GameDesk.iss'

      - name: Build portable zip
        shell: pwsh
        run: |
          $files ='GameDesk.ps1','dashboard.html','logo.svg','logo.png','GameDesk.ico','Install GameDesk.bat','Install.ps1','Uninstall.ps1','README.txt','quiz' | ForEach-Object { "GameDesk/$_" }
          Compress-Archive -Path $files -DestinationPath "installer/Output/GameDesk-${{ steps.ver.outputs.version }}-windows-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/Output/*

      - name: Publish to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*
          generate_release_notes: true

  mac-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version
        if: github.ref_type == 'tag'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install
        run: npm install --no-audit --no-fund

      # Spotlight indexing on the macOS runners keeps the new disk image busy, which breaks the .dmg step.
      - name: Turn off Spotlight indexing
        if: matrix.target == 'mac'
        run: sudo mdutil -a -i off || true

      - name: Build
        run: |
          for i in 1 2 3; do
            npm run dist:${{ matrix.target }} && exit 0
            echo "Build failed (attempt $i), retrying..."; sleep 10
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb

      - name: Publish to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
